# Amazon Bedrock retirement dates, kept in line with AWS's page by script every 6 hours (no AI involved).
# tools/bedrock.mjs refuses to write when the page parses to too few models or too much changes at once;
# the run then fails, which shows on the stats digest and emails the repo owner.
# Pushes made with GITHUB_TOKEN don't start the release workflow: the live list at aidriftline.com picks the change
# up on the website's next 6-hourly build, and the next release bundles it.
name: bedrock
on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

concurrency: registry

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read Bedrock's page and update the registry
        id: sync
        run: |
          node tools/bedrock.mjs --write | tee "$RUNNER_TEMP/bedrock.txt"
          if git diff --quiet registry/models.json; then echo "changed=no" >> "$GITHUB_OUTPUT"; else echo "changed=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Test and push
        if: steps.sync.outputs.changed == 'yes'
        run: |
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          summary=$(head -1 "$RUNNER_TEMP/bedrock.txt")
          git commit -am "Registry re-checked $(date -u +%F): ${summary}" -m "$(tail -n +2 "$RUNNER_TEMP/bedrock.txt")"
          git pull --rebase && git push
