# Ships every change to the registry or the code: tests → version + tag v0.x.y → npm → move v0 → MCP Registry → check.
# npm, the v0 tag and the MCP Registry always end on the same version: a release that stops halfway is finished by the
# next run (or by running this by hand) before any new version starts, and the last step fails if they disagree.
# Runs on its own when main changes (the daily registry robot pushes there), or by hand from the Actions tab.
# Version: a new feature bumps the middle number (0.1.17 → 0.2.0): put [minor] on a line of its own in a commit message, or pick
# "minor" when running by hand. Everything else (fixes, registry updates) bumps the last number (0.2.0 → 0.2.1).
# Pushes made here use GITHUB_TOKEN, which does not start other workflows, so this never loops.
name: release
on:
  push:
    branches: [main]
    paths: ["registry/**", "src/**", "action.yml"]
  workflow_dispatch:
    inputs:
      bump:
        description: "patch = fixes and registry updates, minor = new features"
        type: choice
        options: [patch, minor]
        default: patch

concurrency: release

permissions:
  contents: write
  id-token: write # npm trusted publishing + MCP Registry login, no stored tokens

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      # 1) Pick the version. A release whose tag exists but isn't everywhere yet (npm, @v0, MCP Registry) is
      #    finished first instead of starting a new version, so the three always end on the same number.
      - name: Version
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          last=$(git tag --list 'v0.*.*' | sort -V | tail -1)
          onnpm=$(npm view "@aidriftline/driftline@${last#v}" version 2>/dev/null || true)
          v0=$(git rev-parse "v0^{commit}" 2>/dev/null || true)
          # MCP Registry: yes / no / unknown (unreachable). Unknown never holds up a release.
          if list=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.AI-Driftline/driftline&limit=100"); then
            echo "$list" | grep -qE "\"version\": *\"${last#v}\"" && inmcp=yes || inmcp=no
          else inmcp=unknown; fi
          if [ -z "$onnpm" ] || [ "$v0" != "$(git rev-parse "${last}^{commit}")" ] || [ "$inmcp" = no ]; then
            echo "Finishing $last before anything new (npm: ${onnpm:-missing}, @v0 at $last: $([ "$v0" = "$(git rev-parse "${last}^{commit}")" ] && echo yes || echo no), MCP Registry: $inmcp). Changes after it ship on the next run." >> "$GITHUB_STEP_SUMMARY"
            git checkout -q "$last"
            echo "released=$last" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A daily re-check that only moves the "checked" date is not worth a release.
          models() { node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(JSON.stringify(r.models))"; }
          if git diff --quiet "$last" HEAD -- src action.yml && \
             [ "$(git show "${last}:registry/models.json" | models)" = "$(git show HEAD:registry/models.json | models)" ]; then
            echo "Nothing to release since $last (only the checked date or docs changed)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          kind=patch
          if [ "${{ inputs.bump }}" = "minor" ] || git log "$last"..HEAD --format=%B | grep -qiE '^[[:space:]]*\[minor\][[:space:]]*$'; then kind=minor; fi
          ver=${last#v}; maj=${ver%%.*}; rest=${ver#*.}; min=${rest%%.*}; pat=${rest#*.}
          if [ "$kind" = minor ]; then next="v$maj.$((min + 1)).0"; else next="v$maj.$min.$((pat + 1))"; fi
          node -e "const fs=require('fs'),v='${next#v}';for(const f of ['package.json','server.json']){const p=JSON.parse(fs.readFileSync(f));p.version=v;if(p.packages)p.packages[0].version=v;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')}"
          git add package.json server.json
          git commit -m "Release $next"
          git tag -a "$next" -m "$next"
          # Commit and tag in one all-or-nothing push. @v0 moves only after npm has the version (below).
          git push --atomic origin HEAD:main "$next"
          echo "Released $next ($kind)" >> "$GITHUB_STEP_SUMMARY"
          echo "released=$next" >> "$GITHUB_OUTPUT"
      # 2) npm: trusted publishing (set up once on npmjs.com for this repo + release.yml). Needs npm 11.5+.
      - name: Publish to npm
        if: steps.bump.outputs.released
        run: |
          v=${{ steps.bump.outputs.released }}
          if [ -n "$(npm view "@aidriftline/driftline@${v#v}" version 2>/dev/null)" ]; then echo "npm already has ${v#v}"; exit 0; fi
          npm install -g npm@11
          npm publish --access public --provenance
      # 3) The tag customers use. Retried: GitHub has rejected a tag push once ("missing necessary objects").
      - name: Move v0
        if: steps.bump.outputs.released
        run: |
          v=${{ steps.bump.outputs.released }}
          git tag -fa v0 -m "v0 -> $v" "${v}^{commit}"
          for i in 1 2 3 4; do git push -f origin v0 && exit 0; sleep 15; git fetch -q origin "+refs/tags/*:refs/tags/*" || true; git tag -fa v0 -m "v0 -> $v" "${v}^{commit}"; done; exit 1
      # 4) Official MCP Registry (feeds VS Code, PulseMCP and other directories). Logs in as this repo via OIDC.
      #    Also runs when started by hand from the Actions tab (re-publishes the current server.json).
      - name: Publish to the MCP Registry
        if: steps.bump.outputs.released || github.event_name == 'workflow_dispatch'
        run: |
          v=$(node -p "require('./server.json').version")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.AI-Driftline/driftline&limit=100" | grep -qE "\"version\": *\"$v\""; then echo "MCP Registry already has $v"; exit 0; fi
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm can take several minutes before a new version is visible to the registry's check.
          for i in $(seq 1 12); do ./mcp-publisher publish && exit 0; sleep 60; done; exit 1
      # 5) All three must say the same version, or this run fails (shows on the stats digest; rerun to finish).
      - name: Check npm, @v0 and MCP Registry agree
        if: steps.bump.outputs.released
        run: |
          v=${{ steps.bump.outputs.released }}
          git fetch -q origin "+refs/tags/*:refs/tags/*"
          # npm can take a minute to show a version it just accepted; ask again before calling it a mismatch.
          for i in 1 2 3 4 5 6; do npmv=$(npm view @aidriftline/driftline version); [ "$npmv" = "${v#v}" ] && break; sleep 20; done
          v0ok=$([ "$(git rev-parse "v0^{commit}")" = "$(git rev-parse "${v}^{commit}")" ] && echo yes || echo no)
          # The registry's search can take a little while to show a version it just accepted.
          for i in 1 2 3 4 5 6; do
            mcpok=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.AI-Driftline/driftline&limit=100" | grep -cE "\"version\": *\"${v#v}\"" || true)
            [ "${mcpok:-0}" != 0 ] && break; sleep 20
          done
          echo "npm latest: $npmv · @v0 at $v: $v0ok · MCP Registry has ${v#v}: $([ "${mcpok:-0}" != 0 ] && echo yes || echo no)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$npmv" = "${v#v}" ] && [ "$v0ok" = yes ] && [ "${mcpok:-0}" != 0 ]
