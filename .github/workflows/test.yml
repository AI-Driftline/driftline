name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Run the action against the sample repository
        uses: ./
        with:
          path: test/fixtures/sample-repo
          fail-on: never
