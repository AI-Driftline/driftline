name: Driftline AI Model Check
description: Find AI model IDs in your code, warn before they are retired, and test your prompts on the replacement model.
author: Mirza Tontowi
branding:
  icon: activity
  color: green
inputs:
  path:
    description: Directory to scan, relative to the repository root.
    default: "."
  warn-days:
    description: Flag models retiring within this many days as "at risk".
    default: "90"
  fail-on:
    description: "Fail the job when a model is: retired, at-risk, or never."
    default: retired
  prompts-file:
    description: Prompt file for drift tests (YAML or JSON).
    default: .driftline/prompts.yml
  license-key:
    description: Driftline Pro license code printed by `npx github:AI-Driftline/driftline activate <key>`. Without it, only the scan runs.
    default: ""
  create-issue:
    description: Open or update a GitHub issue with the report ("true" or "false").
    default: "false"
  fix-pr:
    description: 'Open one pull request that renames retiring model IDs where a rename is safe, and keep it up to date ("true" or "false"). Runs only on the default branch. Needs "contents: write" and "pull-requests: write", and "Allow GitHub Actions to create and approve pull requests" turned on in the repository settings.'
    default: "false"
  show-answers:
    description: Include model answers in the job summary ("true" or "false"). They are never put in the issue.
    default: "true"
  registry:
    description: Where the model list comes from. "live" (default) reads aidriftline.com/models.json, updated as soon as a provider changes a date or replacement, and falls back to the copy bundled with this version. "bundled" never fetches.
    default: "live"
  sarif-file:
    description: "Also write the findings as SARIF to this file (e.g. driftline.sarif), for github/codeql-action/upload-sarif to show them in code scanning. Empty: no SARIF."
    default: ""
  github-token:
    description: Token used to open the issue (issues:write) and the fix pull request (contents:write, pull-requests:write). Pull requests opened with the default token don't start other workflows; pass a personal access token if your checks should run on it.
    default: ${{ github.token }}
outputs:
  findings:
    description: Number of model references found.
  at-risk:
    description: Number of references to retired or soon-to-retire models.
  sarif-file:
    description: Path of the SARIF file written (empty when sarif-file wasn't set).
runs:
  using: node24
  main: src/index.js
